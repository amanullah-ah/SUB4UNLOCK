            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;

            for (col = 0; col < moduleCount - 6; col++) {

                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {

	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function safeUrl(u){
  try{ const x = new URL(u); return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : null; }
  catch(e){ return null; }
}
function normalizeUrl(u){
  u = (u || '').trim();
  if(!u) return null;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  return safeUrl(u);
}
function hostOk(u){
  try{ const h = new URL(u).hostname; return h.includes('.') || h === 'localhost'; }catch(e){ return false; }
}
function hostOf(u){ try{ return new URL(u).host.replace(/^www\./,''); }catch(e){ return u; } }

async function api(path, body){
  const resp = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  let data = {};
  try{ data = await resp.json(); }catch(e){}
  return { ok: resp.ok, status: resp.status, data };
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(_){}
    ta.remove();
    return ok;
  }
}

function toast(msg, action){
  const wrap = $('toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${escapeHtml(msg)}</span>`;
  const kill = ()=>{ t.classList.add('out'); setTimeout(()=>t.remove(), 260); };
  if(action){
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = action.label;
    b.addEventListener('click', ()=>{ action.fn(); kill(); });
    t.appendChild(b);
  }
  wrap.appendChild(t);
  setTimeout(kill, action ? 5000 : 2200);
}

const origLink = $('origLink');
function validateLink(){
  const raw = origLink.value.trim();
  const f = $('linkField'), h = $('linkHint');
  f.classList.remove('ok','bad');
  h.className = 'hint';
  if(!raw){ h.textContent = ''; return; }
  const u = normalizeUrl(raw);
  if(u && hostOk(u)){
    f.classList.add('ok');
    h.classList.add('ok');
    const added = !/^[a-z][a-z0-9+.-]*:/i.test(raw);
    h.textContent = (added ? 'https:// added · ' : '') + 'Locking ' + hostOf(u);
  } else {
    f.classList.add('bad');
    h.classList.add('bad');
    h.textContent = 'Use a full link, like https://example.com';
  }
}
origLink.addEventListener('input', validateLink);

  try{
    const t = (await navigator.clipboard.readText()).trim();
    if(!t){ toast('Clipboard is empty'); return; }
    origLink.value = t; validateLink(); origLink.focus();
  }catch(e){ toast('Allow clipboard access to paste'); }
});

const pwInput = $('pw');
function scorePw(v){
  let s = 0;
  if(v.length >= 6) s++;
  if(v.length >= 9) s++;
  if(/[a-z]/.test(v) && /[A-Z]/.test(v) || (/[A-Za-z]/.test(v) && /\d/.test(v))) s++;
  if(/[^A-Za-z0-9]/.test(v) || v.length >= 12) s++;
  return s;
}
function updateMeter(){
  const v = pwInput.value, m = $('pwMeter');
  if(!v){ m.classList.remove('show'); return; }
  const s = scorePw(v);
  m.classList.add('show');
  m.dataset.s = String(Math.max(1, s));
  $('pwMeterText').textContent = ['Weak','Weak','Okay','Good','Strong'][s];
}
pwInput.addEventListener('input', updateMeter);
$('pwToggle').addEventListener('click', ()=>{
  const show = pwInput.type === 'password';
  pwInput.type = show ? 'text' : 'password';
  $('pwToggle').classList.toggle('on', show);
  $('pwToggle').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
});
$('pwGen').addEventListener('click', async ()=>{
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const a = new Uint32Array(12);
  crypto.getRandomValues(a);
  pwInput.value = Array.from(a, x => chars[x % chars.length]).join('');
  pwInput.type = 'text';
  $('pwToggle').classList.add('on');
  updateMeter();
  const ok = await copyText(pwInput.value);
  toast(ok ? 'Strong password generated and copied' : 'Strong password generated');
});

      <div class="plat-text">
        <div class="name">${escapeHtml(p.key)}</div>
        <div class="sub">${escapeHtml(VERBS[p.key] || 'Follow')}</div>
      </div>
      <div class="plat-check">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#0a0b12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>`;
    const toggle = ()=>{
      if(selectedPlatforms.has(p.key)){ selectedPlatforms.delete(p.key); }
      else { selectedPlatforms.add(p.key); }
      row.classList.toggle('on');
      row.setAttribute('aria-checked', row.classList.contains('on'));
      updatePickerMeta();
    };
    row.addEventListener('click', toggle);
    row.addEventListener('keydown', e=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } });
    platformsEl.appendChild(row);
  });
  updatePickerMeta();
}
function updatePickerMeta(){
  const list = visiblePlatforms();
  const allOn = list.length && list.every(p => selectedPlatforms.has(p.key));
  $('platCount').textContent = `${selectedPlatforms.size} of ${PLATFORMS.length} selected`;
  $('platAll').textContent = allOn ? 'Clear' : 'Select all';
  $('platAll').style.display = list.length ? '' : 'none';
  updateDone();
}
$('platAll').addEventListener('click', ()=>{
  const list = visiblePlatforms();
  const allOn = list.every(p => selectedPlatforms.has(p.key));
  list.forEach(p => allOn ? selectedPlatforms.delete(p.key) : selectedPlatforms.add(p.key));
  renderPicker();
});
$('platSearch').addEventListener('input', renderPicker);

function openPicker(){
  $('platSearch').value = '';
  renderPicker();
  $('pickerBg').classList.add('show');
}
function closePicker(){
  $('pickerBg').classList.remove('show');
  renderChosen();
}
$('openPickerBtn').addEventListener('click', openPicker);
$('pickerCloseX').addEventListener('click', closePicker);
$('pickerDoneBtn').addEventListener('click', closePicker);
$('pickerBg').addEventListener('click', (e)=>{ if(e.target.id === 'pickerBg') closePicker(); });

function paintUrlState(input){
  const v = input.value.trim();
  input.classList.remove('ok','bad');
  if(!v) return;
  input.classList.add(normalizeUrl(v) ? 'ok' : 'bad');
}
function renderChosen(){
  const wrap = $('chosenWrap');
  wrap.innerHTML = '';
  selectedPlatforms.forEach(p=>{
    const c = document.createElement('div');
    c.className = 'chosen-chip';
    c.innerHTML = `
      <div class="chip-top">
        ${icoHtml(p)}
        <div class="chip-name"><b>${escapeHtml(p)}</b><small>${escapeHtml(VERBS[p] || 'Follow')} required</small></div>
        <button type="button" class="x" data-p="${escapeHtml(p)}" aria-label="Remove ${escapeHtml(p)}">✕</button>
      </div>
      <input type="text" class="plat-url-input" data-p="${escapeHtml(p)}" aria-label="Your ${escapeHtml(p)} link"
        placeholder="Your ${escapeHtml(p)} profile/channel link" value="${escapeHtml(platformUrls[p]||'')}"
        autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url">`;
    const inp = c.querySelector('.plat-url-input');
    paintUrlState(inp);
    c.querySelector('.x').addEventListener('click', ()=>{
      selectedPlatforms.delete(p);
      delete platformUrls[p];
      renderChosen();
    });
    inp.addEventListener('input', (e)=>{
      platformUrls[p] = e.target.value.trim();
      paintUrlState(inp);
    });
    wrap.appendChild(c);
  });
}

/* ---------------- QR (MIT-licensed generator bundled above) ---------------- */
function drawQR(canvas, text){
  const { QRCode, QRErrorCorrectLevel } = window.__QR;
  const qr = new QRCode(-1, QRErrorCorrectLevel.M);
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount(), scale = 8, quiet = 4;
  const size = (n + quiet * 2) * scale;
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#0a0b12';
  for(let r = 0; r < n; r++){
    for(let c = 0; c < n; c++){
      if(qr.isDark(r, c)) ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
    }
  }
}

/* ---------------- history ---------------- */
const HISTORY_KEY = 'sub4unlock_history';
function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }catch(e){ return []; }
}
function saveHistory(list){
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }catch(e){}
}
function timeAgo(ts){
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if(s < 60) return 'just now';
  if(s < 3600) return Math.floor(s / 60) + 'm ago';
  if(s < 86400) return Math.floor(s / 3600) + 'h ago';
  if(s < 7 * 86400) return Math.floor(s / 86400) + 'd ago';
  return new Date(ts).toLocaleDateString();
}
function avatarsHtml(platforms){
  if(!platforms.length) return '';
  const shown = platforms.slice(0, 5);
  let h = '<span class="avatars">' + shown.map(p => icoHtml(p, 'av')).join('');
  if(platforms.length > shown.length) h += `<span class="av">+${platforms.length - shown.length}</span>`;
  return h + '</span>';
}
function renderHistory(){
  const list = loadHistory();
  const el = $('histList');
  if(!list.length){ el.innerHTML = '<div class="empty">No links generated yet</div>'; return; }
  el.innerHTML = '';
  list.slice().reverse().forEach(item=>{
    const n = item.platforms.length;
    const div = document.createElement('div');
    div.className = 'hist-item';
    div.innerHTML = `
      <div class="hist-top">
        <span class="hist-link">${escapeHtml(item.shareUrl)}</span>
        <span class="hist-actions">
          <button type="button" class="icon-btn copy" aria-label="Copy link" title="Copy link">${IC.copy}</button>
          <button type="button" class="hist-open">Open →</button>
          <button type="button" class="icon-btn del" aria-label="Delete" title="Delete">${IC.trash}</button>
        </span>
      </div>
      <div class="hist-meta">
        ${avatarsHtml(item.platforms)}
        <span>${n ? n + ' platform' + (n > 1 ? 's' : '') : 'no platforms'}</span>
        <span>${item.hasPw ? '<svg class="lk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>password' : 'no password'}</span>
        <span>${timeAgo(item.created)}</span>
      </div>`;
    div.querySelector('.copy').addEventListener('click', async ()=>{
      toast((await copyText(item.shareUrl)) ? 'Link copied' : 'Could not copy');
    });
    div.querySelector('.hist-open').addEventListener('click', ()=> window.open(item.shareUrl, '_blank'));
    div.querySelector('.del').addEventListener('click', ()=>{
      const before = loadHistory();
      saveHistory(before.filter(h => !(h.shortId === item.shortId && h.created === item.created)));
      renderHistory();
      toast('Link removed from history', { label:'Undo', fn:()=>{ saveHistory(before); renderHistory(); } });
    });
    el.appendChild(div);
  });
}
$('clearBtn').addEventListener('click', ()=>{
  const before = loadHistory();
  if(!before.length) return;
  saveHistory([]);
  renderHistory();
  toast('History cleared', { label:'Undo', fn:()=>{ saveHistory(before); renderHistory(); } });
});

/* ---------------- generate ---------------- */
const genBtn = $('genBtn');
const resultEl = $('result');

function showErr(msg){
  resultEl.className = 'result show error';
  resultEl.innerHTML = `<div class="res-err">${escapeHtml(msg)}</div>`;
}
function setLoading(on){
  genBtn.disabled = on;
  genBtn.classList.toggle('loading', on);
  $('genLabel').textContent = on ? 'Generating…' : 'Generate locked link';
  $('mark').classList.toggle('busy', on);
}

function renderResult(item){
  const n = item.platforms.length;
  const parts = [];
  if(n) parts.push('verify ' + n + ' platform' + (n > 1 ? 's' : ''));
  if(item.hasPw) parts.push('enter the password');
  const note = parts.length
    ? 'Anyone opening it must ' + parts.join(' and ') + ' before the real link is revealed.'
    : 'No follow or password is set, so anyone with this link can open it.';
  const nativeShare = !!navigator.share;
  const enc = encodeURIComponent(item.shareUrl);

  resultEl.className = 'result show';
  resultEl.innerHTML = `
    <div class="res-head">
      <span class="res-check">${IC.check}</span>
      <div><b>Locked link generated</b><small>Share this URL with your audience</small></div>
    </div>
    <div class="res-link"><code>${escapeHtml(item.shareUrl)}</code></div>
    <p class="res-note">${escapeHtml(note)}</p>
    <div class="res-actions">
      <button type="button" class="act primary" id="copyBtn">${IC.copy}<span>Copy</span></button>
      <button type="button" class="act" id="tryBtn">${IC.test}<span>Test</span></button>
      <button type="button" class="act" id="shareBtn">${IC.share}<span>Share</span></button>
      <button type="button" class="act" id="qrBtn">${IC.qr}<span>QR</span></button>
    </div>
    <div class="share-row" id="shareRow" hidden>
      <a class="share-chip" target="_blank" rel="noopener noreferrer" href="https://wa.me/?text=${enc}">${icoHtml('WhatsApp')}WhatsApp</a>
      <a class="share-chip" target="_blank" rel="noopener noreferrer" href="https://t.me/share/url?url=${enc}">${icoHtml('Telegram')}Telegram</a>
      <a class="share-chip" target="_blank" rel="noopener noreferrer" href="https://twitter.com/intent/tweet?url=${enc}">${icoHtml('X / Twitter')}X</a>
    </div>
    <div class="qr-panel" id="qrPanel" hidden>
      <canvas id="qrCanvas" aria-label="QR code for the locked link"></canvas>
      <div>
        <p>Scan to open the locked link on a phone.</p>
        <button type="button" class="act" id="qrDl">${IC.download}<span>Download PNG</span></button>
      </div>
    </div>`;

  $('copyBtn').addEventListener('click', async ()=>{
    const ok = await copyText(item.shareUrl);
    const label = $('copyBtn').querySelector('span');
    label.textContent = ok ? 'Copied' : 'Press Ctrl+C';
    setTimeout(()=>{ label.textContent = 'Copy'; }, 1600);
  });
  $('tryBtn').addEventListener('click', ()=> window.open(item.shareUrl, '_blank'));
  $('shareBtn').addEventListener('click', async ()=>{
    if(nativeShare){
      try{ await navigator.share({ title:'Locked link', url:item.shareUrl }); return; }
      catch(e){ if(e && e.name === 'AbortError') return; }
    }
    $('shareRow').hidden = !$('shareRow').hidden;
  });
  let qrDrawn = false;
  $('qrBtn').addEventListener('click', ()=>{
    const panel = $('qrPanel');
    panel.hidden = !panel.hidden;
    if(!panel.hidden && !qrDrawn){
      try{ drawQR($('qrCanvas'), item.shareUrl); qrDrawn = true; }
      catch(e){ panel.hidden = true; toast('Could not create the QR code'); }
    }
  });
  $('qrDl').addEventListener('click', ()=>{
    const a = document.createElement('a');
    a.href = $('qrCanvas').toDataURL('image/png');
    a.download = 'sub4unlock-' + item.shortId + '.png';
    a.click();
  });
}

function snapMark(){
  const m = $('mark');
  m.classList.add('busy');
  setTimeout(()=> m.classList.remove('busy'), 700);
}

async function generate(){
  const rawUrl = origLink.value.trim();
  const pw = pwInput.value;

  if(!rawUrl){ origLink.focus(); return showErr('Please paste the link you want to lock.'); }
  const url = normalizeUrl(rawUrl);
  if(!url || !hostOk(url)){ origLink.focus(); return showErr('That link doesn\'t look valid. Use a full http(s) link.'); }

  const pUrls = {};
  for(const p of selectedPlatforms){
    const u = normalizeUrl(platformUrls[p]);
    if(!u){
      const inp = document.querySelector(`.plat-url-input[data-p="${CSS.escape(p)}"]`);
      if(inp){ inp.classList.add('bad'); inp.focus(); }
      return showErr(`Add a valid ${p} profile/channel link.`);
    }
    pUrls[p] = u;
  }

  if(selectedPlatforms.size === 0 && !pw){
    return showErr('Add at least one platform or set a password to create a locked link.');
  }

  resultEl.className = 'result';
  resultEl.innerHTML = '';
  setLoading(true);

  let data;
  try{
    const r = await api('/api/links', {
      url, pw: pw || null,
      platforms: Array.from(selectedPlatforms),
      platformUrls: pUrls
    });
    data = r.data;
    if(!r.ok) throw new Error(data.error || 'Failed to generate link.');
  }catch(e){
    setLoading(false);
    return showErr(e.message || 'Something went wrong. Is the backend running?');
  }
  setLoading(false);

  const item = {
    shortId: data.shortId, shareUrl: data.shareUrl, hasPw: !!pw,
    platforms: Array.from(selectedPlatforms), created: Date.now()
  };
  const hist = loadHistory();
  hist.push(item);
  saveHistory(hist);

  renderResult(item);
  snapMark();

  origLink.value = '';
  pwInput.value = '';
  pwInput.type = 'password';
  $('pwToggle').classList.remove('on');
  selectedPlatforms.clear();
  platformUrls = {};
  validateLink();
  updateMeter();
  renderChosen();
  renderHistory();
  resultEl.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block:'nearest' });
}
genBtn.addEventListener('click', generate);
[origLink, pwInput].forEach(el => el.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); generate(); } }));

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && $('pickerBg').classList.contains('show')) closePicker();
});

renderHistory();

</script>
